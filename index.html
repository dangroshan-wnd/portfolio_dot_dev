<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dan Groshan</title>
  <meta name="description" content="See you soon...">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      overflow: hidden;
      background: linear-gradient(#8ecbea 0%, #bfe0ee 40%, #fde3b8 72%, #f6cf95 100%);
      font-family: "Fraunces", Georgia, serif;
    }
    h1 {
      position: absolute; z-index: 1; left: 0; right: 0; top: 9vh;
      margin: 0; padding: 0 16px; text-align: center;
      font-style: italic; font-weight: 600;
      font-size: clamp(2.6rem, 9vw, 6rem);
      color: #5b3a29;
      text-shadow: 0 2px 0 rgba(255,255,255,.45);
    }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .sway-goose, .sway-pig { transform-box: view-box; animation: sway 5s ease-in-out infinite alternate; }
    .sway-goose { transform-origin: 522px 505px; }
    .sway-pig   { transform-origin: 857px 632px; animation-duration: 6.5s; animation-delay: -2s; }
    .flutter { transform-box: fill-box; transform-origin: 50% 20%; animation: flutter 1.6s ease-in-out infinite alternate; }
    .tail { animation: wiggle 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
    .drift { animation: drift 70s linear infinite; }
    .drift.slow { animation-duration: 110s; animation-delay: -40s; }

    @keyframes sway    { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
    @keyframes flutter { from { transform: rotate(-4deg); }   to { transform: rotate(4deg); } }
    @keyframes wiggle  { from { transform: skewX(-8deg); }    to { transform: skewX(8deg); } }
    @keyframes drift   { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }

    @media (prefers-reduced-motion: reduce) {
      .sway-goose, .sway-pig, .flutter, .tail, .drift { animation: none; }
    }
  </style>
</head>
<body>
  <h1>See you soon...</h1>

  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" role="img"
       aria-label="A goose and a red pig flying kites in the desert">
    <!-- clouds -->
    <g class="drift" fill="#fff" opacity=".85">
      <ellipse cx="0" cy="110" rx="60" ry="20"/><ellipse cx="35" cy="96" rx="38" ry="22"/><ellipse cx="-30" cy="102" rx="30" ry="16"/>
    </g>
    <g class="drift slow" fill="#fff" opacity=".7">
      <ellipse cx="0" cy="200" rx="48" ry="15"/><ellipse cx="24" cy="189" rx="28" ry="17"/>
    </g>

    <!-- sun -->
    <circle cx="630" cy="400" r="70" fill="#ffe9a8" opacity=".55"/>
    <circle cx="630" cy="400" r="52" fill="#ffd36b"/>

    <!-- dunes -->
    <path d="M0 560 Q200 500 420 545 T900 530 T1200 520 V800 H0Z" fill="#f2cf93"/>
    <path d="M0 610 Q350 560 650 600 T1200 590 V800 H0Z" fill="#ebb878"/>

    <!-- cacti -->
    <g fill="#6f9460">
      <rect x="138" y="505" width="24" height="110" rx="12"/>
      <rect x="112" y="540" width="16" height="44" rx="8"/><rect x="112" y="570" width="36" height="14" rx="7"/>
      <rect x="172" y="525" width="16" height="44" rx="8"/><rect x="152" y="555" width="36" height="14" rx="7"/>
    </g>
    <g fill="#7ba06b">
      <rect x="1050" y="520" width="20" height="85" rx="10"/>
      <rect x="1074" y="540" width="13" height="34" rx="6.5"/><rect x="1060" y="563" width="27" height="11" rx="5.5"/>
    </g>

    <path d="M0 660 Q300 630 600 655 T1200 650 V800 H0Z" fill="#e3a463"/>

    <!-- shadows -->
    <ellipse cx="440" cy="668" rx="58" ry="8" fill="#b97c43" opacity=".35"/>
    <ellipse cx="760" cy="672" rx="70" ry="9" fill="#b97c43" opacity=".35"/>

    <!-- goose's kite -->
    <g class="sway-goose">
      <path d="M522 505 Q470 430 370 290" fill="none" stroke="#5b3a29" stroke-width="1.6"/>
      <g transform="translate(370 290) rotate(-15)">
        <g class="flutter">
          <path class="tail" d="M0 85 C18 120 -18 150 0 185 C18 220 -10 245 4 275" fill="none" stroke="#5b3a29" stroke-width="1.5"/>
          <path d="M-9 128 L9 136 L9 124 L-9 132Z M-9 186 L9 194 L9 182 L-9 190Z M-6 240 L12 248 L12 236 L-6 244Z" fill="#e76f51"/>
          <polygon points="0,-55 40,0 0,85 -40,0" fill="#2a9d8f"/>
          <polygon points="0,-55 40,0 0,0" fill="#e9c46a"/>
          <polygon points="0,0 -40,0 0,85" fill="#e9c46a"/>
          <path d="M0 -55 V85 M-40 0 H40" stroke="#5b3a29" stroke-width="1.5" opacity=".5"/>
        </g>
      </g>
    </g>

    <!-- pig's kite -->
    <g class="sway-pig">
      <path d="M857 632 Q930 470 930 250" fill="none" stroke="#5b3a29" stroke-width="1.6"/>
      <g transform="translate(930 250) rotate(12)">
        <g class="flutter" style="animation-delay:-.7s">
          <path class="tail" d="M0 85 C-18 120 18 150 0 185 C-18 220 10 245 -4 275" fill="none" stroke="#5b3a29" stroke-width="1.5"/>
          <path d="M-9 128 L9 136 L9 124 L-9 132Z M-9 186 L9 194 L9 182 L-9 190Z M-12 240 L6 248 L6 236 L-12 244Z" fill="#f4d35e"/>
          <polygon points="0,-55 40,0 0,85 -40,0" fill="#3d6bd6"/>
          <polygon points="0,-55 -40,0 0,0" fill="#f4d35e"/>
          <polygon points="0,0 40,0 0,85" fill="#f4d35e"/>
          <path d="M0 -55 V85 M-40 0 H40" stroke="#5b3a29" stroke-width="1.5" opacity=".5"/>
        </g>
      </g>
    </g>

    <!-- goose -->
    <g transform="translate(430 600) scale(1.1)">
      <g stroke="#f08a24" stroke-width="4" stroke-linecap="round">
        <line x1="-6" y1="24" x2="-6" y2="54"/><line x1="12" y1="24" x2="12" y2="54"/>
      </g>
      <path d="M-10 53 h15 l-3 5 h-12z M8 53 h15 l-3 5 h-12z" fill="#f08a24"/>
      <path d="M-44 -8 L-68 -20 L-56 6 Z" fill="#e6e1d6"/>
      <ellipse cx="0" cy="0" rx="50" ry="30" fill="#f7f4ec" stroke="#d6cfbf" stroke-width="2"/>
      <path d="M-32 -6 Q0 -22 28 -2 Q4 16 -32 -6Z" fill="#e4ddd0"/>
      <path d="M26 -12 C40 -40 38 -66 54 -86" fill="none" stroke="#f7f4ec" stroke-width="18" stroke-linecap="round"/>
      <circle cx="55" cy="-88" r="14" fill="#f7f4ec"/>
      <path d="M66 -93 L84 -86 L66 -80 Z" fill="#f08a24"/>
      <circle cx="59" cy="-92" r="2.6" fill="#2b1a14"/>
    </g>

    <!-- red pig -->
    <g transform="translate(760 610) scale(1.1)">
      <g fill="#b9362c">
        <rect x="-44" y="18" width="13" height="34" rx="5"/>
        <rect x="-24" y="20" width="13" height="32" rx="5"/>
        <rect x="18" y="20" width="13" height="32" rx="5"/>
      </g>
      <path d="M-55 -8 c-12 -6 -16 8 -7 9 c9 1 6 -13 -5 -12" fill="none" stroke="#b9362c" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-4" cy="0" rx="55" ry="38" fill="#d9473b"/>
      <path d="M30 -40 L36 -58 L48 -42 Z" fill="#b9362c"/>
      <circle cx="48" cy="-15" r="30" fill="#d9473b"/>
      <path d="M50 -42 L64 -56 L66 -36 Z" fill="#c53d32"/>
      <ellipse cx="78" cy="-8" rx="10" ry="13" fill="#ef7a6c"/>
      <circle cx="81" cy="-12" r="2" fill="#8a2a22"/><circle cx="81" cy="-3" r="2" fill="#8a2a22"/>
      <circle cx="58" cy="-23" r="3.5" fill="#2b1a14"/>
      <circle cx="52" cy="-5" r="6" fill="#f08b7e" opacity=".6"/>
      <path d="M60 8 q6 4 12 0" fill="none" stroke="#7a2520" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 16 L84 20" stroke="#d9473b" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="88" cy="20" rx="5" ry="6.5" fill="#7a2520"/>
    </g>
  </svg>

  <script>
    // On portrait screens show the whole scene instead of cropping the sides.
    (function () {
      var svg = document.getElementById('scene');
      function fit() {
        if (innerWidth / innerHeight < 1) {
          svg.setAttribute('viewBox', '290 60 700 740');
          svg.setAttribute('preserveAspectRatio', 'xMidYMax meet');
        } else {
          svg.setAttribute('viewBox', '0 0 1200 800');
          svg.setAttribute('preserveAspectRatio', 'xMidYMax slice');
        }
      }
      fit();
      addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
