<!doctype html>
<!-- Hand-written page (not generated). To add a game: add it to GAMES below; see .agents/skills/add-game. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Games · Dan Groshan</title>
  <meta name="description" content="Little games starring Noodles and Shady.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="page-games">
  <aside class="sidebar">
    <a class="brand" href="../">dangroshan.dev</a>
    <nav class="nav" aria-label="Pages">
      <a href="../" style="--c:var(--home)"><span class="dot"></span>Home</a>
      <a href="../work/" style="--c:var(--work)"><span class="dot"></span>Work</a>
      <a href="../projects/" style="--c:var(--projects)"><span class="dot"></span>Projects</a>
      <a href="../movies/" style="--c:var(--movies)"><span class="dot"></span>Movies</a>
      <a href="./" style="--c:var(--games)" aria-current="page"><span class="dot"></span>Games</a>
    </nav>
  </aside>

  <main class="arcade">
    <div class="arcade-bar">
      <nav class="game-tabs" id="tabs" aria-label="Choose a game"></nav>
      <a class="popout" id="popout" href="shadys-snack-attack/">Open full screen ↗</a>
    </div>
    <iframe class="player" id="player" src="shadys-snack-attack/" title="Shady's Snack Attack" allow="autoplay; fullscreen"></iframe>
  </main>

  <script>
    // Every game lives in games/<slug>/index.html and is embedded here. Add new games to this list.
    const GAMES = [
      { slug: 'shadys-snack-attack', title: "Shady's Snack Attack" },
    ];

    const tabs = document.getElementById('tabs');
    const player = document.getElementById('player');
    const popout = document.getElementById('popout');

    function select(slug, { push = false } = {}) {
      const game = GAMES.find(g => g.slug === slug) || GAMES[0];
      if (!player.src.endsWith(`/${game.slug}/`)) player.src = `${game.slug}/`;
      player.title = game.title;
      popout.href = `${game.slug}/`;
      for (const a of tabs.children) a.toggleAttribute('aria-current', a.dataset.slug === game.slug);
      if (push) history.replaceState(null, '', `#${game.slug}`);
    }

    for (const g of GAMES) {
      const a = document.createElement('a');
      a.href = `#${g.slug}`; a.textContent = g.title; a.dataset.slug = g.slug;
      a.addEventListener('click', e => { e.preventDefault(); select(g.slug, { push: true }); });
      tabs.append(a);
    }
    select(location.hash.slice(1));
    addEventListener('hashchange', () => select(location.hash.slice(1)));

    // Hand keyboard focus to the game so "press any key" works without clicking first.
    player.addEventListener('load', () => { try { player.contentWindow.focus(); } catch {} });
  </script>
</body>
</html>
